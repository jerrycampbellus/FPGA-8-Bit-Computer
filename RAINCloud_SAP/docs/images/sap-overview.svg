<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">RAINCloud SAP system overview</title><desc id="desc">DE10-Lite inputs pass through input conditioning into the SAP CPU. A 50 MHz clock drives the clock generator and input conditioner. Clock and microcode control the eight-bit datapath; state and output are routed to the diagnostic display. Reset and mode routes are grouped.</desc>
