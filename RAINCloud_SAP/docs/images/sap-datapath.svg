<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img" aria-labelledby="title desc">
<title id="title">RAINCloud SAP CPU datapath</title><desc id="desc">Six gated source buses feed data_bus. Program counter, RAM, instruction register, A and B registers have separate read and load paths. MAR supplies the four-bit RAM address. A and B feed the ALU directly. The bus loads MAR, output register, and the display sampler. Clock/reset/control and diagnostic taps are grouped in the system overview.</desc>
