<text x="60" y="932" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#52677c">PC and instruction outputs are zero-extended to 8 bits. *B output exists but is unused by current microcode.</text>
<text x="60" y="963" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#52677c">Control, clock, reset, and JC_Display observation taps are documented separately to keep the datapath readable.</text>
